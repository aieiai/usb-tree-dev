<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
<title> USB Debug Tool </title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0d1115;
    --panel: #151b21;
    --panel2: #1b232b;
    --line: #2a3540;
    --text: #d7e0e8;
    --muted: #8b98a5;
    --accent: #38b2ac;
    --blue: #2b6cb0;
    --red: #e53e3e;
    --green: #38a169;
    --font-mono: "Cascadia Mono", Consolas, "Sarasa Mono SC", monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.45 var(--font-mono);
  }
  header {
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    padding: 10px 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  header h1 {
    margin: 0 12px 0 0;
    font-size: 16px;
    font-weight: 600;
  }
  button, select, input {
    font: inherit;
  }
  button {
    border: 0;
    border-radius: 4px;
    padding: 6px 12px;
    color: #fff;
    background: var(--blue);
    cursor: pointer;
  }
  button.secondary { background: #394653; }
  button.danger { background: #7b2d2d; }
  button:disabled {
    color: #7f8a95;
    background: #303840;
    cursor: not-allowed;
  }
  input, select {
    min-width: 0;
    padding: 6px 8px;
    color: var(--text);
    background: #0a0e12;
    border: 1px solid var(--line);
    border-radius: 4px;
    outline: none;
  }
  input:focus, select:focus { border-color: var(--accent); }
  label { color: var(--muted); }
  #status {
    flex: none;
    padding: 7px 14px;
    color: var(--muted);
    border-bottom: 1px solid var(--line);
  }
  #status b { color: var(--accent); font-weight: normal; }
  #app {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
  }
  #sidebar {
    flex: 0 0 104px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 10px 8px;
    background: var(--panel);
    border-right: 1px solid var(--line);
  }
  .nav-btn {
    padding: 9px 12px;
    text-align: left;
    color: var(--muted);
    background: transparent;
    border: 1px solid transparent;
  }
  .nav-btn:hover { color: var(--text); background: var(--panel2); }
  .nav-btn.active {
    color: var(--accent);
    background: #143038;
    border-color: #1f4b52;
  }
  #content {
    flex: 1 1 auto;
    min-width: 0;
    min-height: 0;
    display: flex;
    padding: 10px;
  }
  .view {
    display: none;
    flex: 1 1 auto;
    min-width: 0;
    min-height: 0;
    flex-direction: column;
    gap: 10px;
    overflow-y: auto;
  }
  .view.active { display: flex; }
  #view-debug { overflow: hidden; }
  /* 改键页上 40%、下 60%，窗口过矮时整页滚动 */
  #view-remap { overflow-y: auto; }
  #view-remap > .interface { min-height: 0; }
  #view-remap > .keyboard-card { flex: 4 1 0; min-height: 120px; }
  #view-remap > .interface:not(.keyboard-card) { flex: 6 1 0; min-height: 200px; }
  #layout-bottom {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.05fr);
    gap: 10px;
  }
  #left {
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 9px;
    overflow-y: auto;
  }
  /* 卡片保持内容高度，超出时由 #left 滚动，避免被 flex 压缩后裁切 */
  #left > * { flex: 0 0 auto; }
  #interfaces {
    display: flex;
    flex-direction: column;
    gap: 9px;
  }
  .interface {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
  }
  .interface-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    background: var(--panel2);
  }
  .interface-head strong { font-size: 14px; }
  .grow { flex: 1; }
  .muted { color: var(--muted); }
  .hint {
    color: var(--muted);
    font-size: 12px;
    padding: 0 10px 7px;
  }
  .claim {
    color: var(--muted);
    white-space: nowrap;
  }
  .claim.ok { color: var(--accent); }
  .claim.fail { color: #fc8181; }
  .endpoints { padding: 4px 10px 10px; }
  .endpoint {
    padding: 8px 0;
    border-top: 1px solid #222c35;
  }
  .endpoint:first-child { border-top: 0; }
  .endpoint-line {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .endpoint-name { flex: 1 1 170px; min-width: 0; }
  .endpoint-name b { color: var(--accent); font-weight: normal; }
  .read-state {
    color: var(--muted);
    font-size: 12px;
    margin-left: auto;
  }
  .upgrade-body {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 8px 10px 10px;
  }
  .upgrade-row {
    display: flex;
    align-items: center;
    gap: 7px;
    flex-wrap: wrap;
  }
  .upgrade-row input[type="file"] { flex: 1 1 200px; min-width: 0; }
  .kc-panel {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 8px 10px 10px;
  }
  /* 键盘卡片撑满上半区，键盘在其中水平垂直居中 */
  .keyboard-card .kc-panel {
    height: 100%;
    padding: 16px;
    align-items: center;
    justify-content: center;
  }
  #view-remap > .interface:not(.keyboard-card) .kc-panel {
    height: 100%;
    gap: 10px;
  }
  .picker {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    gap: 10px;
  }
  .picker-tabs {
    flex: 0 0 96px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .picker-tab {
    padding: 8px 10px;
    text-align: left;
    color: var(--muted);
    background: transparent;
    border: 1px solid transparent;
  }
  .picker-tab:hover { color: var(--text); background: var(--panel2); }
  .picker-tab.active {
    color: var(--accent);
    background: #143038;
    border-color: #1f4b52;
  }
  .picker-groups,
  .picker-board {
    flex: 1 1 auto;
    min-width: 0;
    min-height: 0;
    padding: 10px;
    background: var(--panel2);
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  .picker-groups {
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .picker-group-title {
    margin: 0 0 6px;
    font-size: 12px;
    font-weight: normal;
    color: var(--muted);
  }
  .picker-keys {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .pick-key {
    min-width: 58px;
    height: 32px;
    padding: 0 8px;
    color: var(--text);
    background: var(--panel2);
    border: 1px solid var(--line);
    border-radius: 5px;
    font-size: 12px;
  }
  .pick-key:hover { color: #e6fffb; border-color: var(--accent); }
  /* 基本字符页：整块 104 配列网格，1u 键帽为正方形。 */
  .picker-board {
    overflow: auto;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .board {
    flex: none;
    display: grid;
    grid-template-columns:
      repeat(64, var(--q)) var(--sg)
      repeat(12, var(--q)) var(--sg)
      repeat(16, var(--q));
    grid-template-rows: repeat(6, var(--key));
  }
  .board-key {
    margin: 2px;
    min-width: 0;
    padding: 0 2px;
    color: var(--text);
    background: #202832;
    border: 1px solid var(--line);
    border-radius: 4px;
    font-size: 9px;
    line-height: 1.05;
    white-space: pre-line;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .board-key:hover { color: #e6fffb; border-color: var(--accent); }
  .kc-toolbar {
    display: flex;
    align-items: center;
    gap: 7px;
    flex-wrap: wrap;
  }
  .kc-toolbar .kc-state { margin-left: auto; }
  .kc-toolbar #kcLayer { flex: 0 0 auto; }
  .kc-toolbar #kcCode { flex: 1 1 140px; min-width: 0; }
  .keyboard {
    --keycap-height: 38px;
    width: 100%;
    max-width: 540px;
    min-width: 0;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .kb-row {
    display: grid;
    gap: 5px;
  }
  .keycap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    min-width: 0;
    height: var(--keycap-height);
    padding: 3px 4px;
    color: var(--text);
    background: var(--panel2);
    border: 1px solid var(--line);
    border-radius: 5px;
    font: inherit;
    font-size: 11px;
    line-height: 1.15;
    cursor: pointer;
    overflow: hidden;
    user-select: none;
  }
  .keycap:hover { border-color: var(--accent); }
  .keycap.selected {
    color: #e6fffb;
    background: #143038;
    border-color: var(--accent);
    box-shadow: inset 0 0 0 1px var(--accent);
  }
  .keycap .kc-value {
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 11px;
    color: var(--muted);
  }
  .keycap .kc-value.set { color: var(--text); }
  .device-info-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    padding: 8px 10px;
    border-top: 1px solid #222c35;
    border-bottom: 1px solid #222c35;
  }
  #ccDeviceInfo {
    flex: 1 1 240px;
    min-width: 0;
    color: var(--accent);
    font-size: 12px;
    overflow-wrap: anywhere;
  }
  #firmwareState { color: var(--accent); }
  #firmwareState.warn { color: #f6ad55; }
  #firmwareState.err { color: #fc8181; }
  #firmwareProgress {
    width: 100%;
    height: 10px;
    accent-color: var(--accent);
  }
  #firmwareMeta {
    min-height: 17px;
    color: var(--muted);
    font-size: 12px;
  }
  .firmware-meta-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  #firmwareDuration {
    margin-left: auto;
    color: var(--accent);
    font-size: 12px;
    white-space: nowrap;
  }
  .send-row {
    display: flex;
    gap: 7px;
    margin-top: 7px;
  }
  .send-row input { flex: 1; }
  #right {
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
  }
  #log-head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    background: var(--panel2);
    border-bottom: 1px solid var(--line);
  }
  #log {
    flex: 1 1 auto;
    min-height: 0;
    margin: 0;
    padding: 9px 10px;
    overflow: auto;
    white-space: pre-wrap;
    word-break: break-all;
    background: #090c0f;
  }
  .warn { color: #f6ad55; }
  .err { color: #fc8181; }
  @media (max-width: 900px) {
    html, body { height: auto; }
    body { display: block; min-height: 100%; }
    #app { display: block; }
    #sidebar {
      flex-direction: row;
      overflow-x: auto;
      padding: 8px;
      border-right: 0;
      border-bottom: 1px solid var(--line);
    }
    .nav-btn { flex: 0 0 auto; text-align: center; }
    #content { display: block; }
    .view { display: none; }
    .view.active { display: flex; }
    #layout-bottom { display: block; }
    #left { overflow: visible; }
    #right { height: 60vh; margin-top: 10px; }
  }
</style>
</head>
<body>
<header>
  <h1> USB Debug Tool </h1>
  <button id="btnConnect">连接设备</button>
  <button id="btnDisconnect" class="danger" disabled>断开</button>
  <label><input id="chkAllInterfaces" type="checkbox"> 尝试占用全部接口</label>
  <label>显示
    <select id="displayMode">
      <option value="text">文本</option>
      <option value="hex">HEX</option>
    </select>
  </label>
  <label>发送
    <select id="inputMode">
      <option value="text">文本</option>
      <option value="hex">HEX</option>
    </select>
  </label>
  <label><input id="chkLf" type="checkbox" checked> 文本追加 LF</label>
  <button id="btnClear" class="secondary">清空日志</button>
</header>

<div id="status">未连接。选择 USB 设备。</div>

<div id="app">
  <nav id="sidebar">
    <button class="nav-btn active" data-view="remap">改键</button>
    <button class="nav-btn" data-view="upgrade">升级</button>
    <button class="nav-btn" data-view="debug">Debug</button>
  </nav>
  <main id="content">
    <section id="view-remap" class="view active">
      <section class="interface keyboard-card">
        <div class="kc-panel">
          <div id="keyboard" class="keyboard"></div>
        </div>
      </section>
      <section class="interface">
        <div class="kc-panel">
          <div class="kc-toolbar">
            <label>层 <select id="kcLayer"></select></label>
            <button id="btnKcReadLayer" class="secondary" disabled>读取本层</button>
            <span id="kcState" class="muted kc-state">未连接</span>
          </div>
          <div class="picker">
            <div id="pickerTabs" class="picker-tabs"></div>
            <div id="pickerGroups" class="picker-groups"></div>
          </div>
        </div>
      </section>
    </section>

    <section id="view-upgrade" class="view">
      <section class="interface">
        <div class="interface-head">
          <strong class="grow">CC 调试 / 固件升级</strong>
          <span id="ccPacketInfo" class="muted">等待读取设备端点</span>
        </div>
        <div class="hint">
          走 Rot-Gen 帧（12 字节头，src=0/DST=1，options 请求位）+ Rot-CC 消息
          （cmd/subcmd/reserve/payload）。升级文件需包含 16 字节官方升级头；
          降级兼容由设备固件处理，网页原样发送文件。
        </div>
        <div class="device-info-row">
          <span id="ccDeviceInfo">设备信息：--</span>
          <button id="btnCcQuery" class="secondary" disabled>查询设备信息</button>
        </div>
        <div class="upgrade-body">
          <div class="upgrade-row">
            <input id="firmwareFile" type="file" accept=".bin,.img,.fw,.ota">
            <button id="btnFirmwareStart" disabled>开始升级</button>
            <button id="btnFirmwareCancel" class="danger" disabled>取消</button>
          </div>
          <div id="firmwareState" aria-live="polite">请选择升级文件。</div>
          <progress id="firmwareProgress" max="1" value="0"></progress>
          <div class="firmware-meta-row">
            <div id="firmwareMeta">0 B / 0 B</div>
            <span id="firmwareDuration">总用时 --</span>
          </div>
        </div>
      </section>
    </section>

    <section id="view-debug" class="view">
      <div id="layout-bottom">
        <section id="left">
          <section id="interfaces">
            <div class="interface">
              <div class="interface-head"><strong>尚未连接</strong></div>
              <div class="hint">连接后会列出所有接口、端点和 claim 结果。</div>
            </div>
          </section>
        </section>
        <section id="right">
          <div id="log-head">
            <strong class="grow">数据日志</strong>
            <span id="traffic" class="muted">RX 0 B · TX 0 B</span>
          </div>
          <pre id="log"></pre>
        </section>
      </div>
    </section>
  </main>
</div>

<script>
'use strict';

const VID = 0x7989;
const PID = 0x0001;
const MAX_LOG_CHARS = 300000;

/* Rot-Gen 通用帧层 */
const RG = Object.freeze({
  SOF: 0x52,
  VERSION: 1,
  HEADER_SIZE: 12,
  SECRET_KEY: 0,
  ADDR_CC: 0,
  ADDR_KEYBOARD: 1,
  OPT_REQUEST: 0x08,
  CRC8_OFFSET: 9,
  CRC16_OFFSET: 10
});

/* Rot-CC 设备协议 */
const CC = Object.freeze({
  HEADER_SIZE: 4,
  CMD_SYS: 0x00,
  CMD_KC: 0x01,
  CMD_UPGRADE: 0x02,
  SYS_VERSION: 0x00,
  SYS_HANDSHAKE: 0x01,
  SYS_INFO: 0x02,
  SYS_REBOOT: 0x03,
  SYS_RESET: 0x04,
  KC_GET: 0x00,
  KC_SET: 0x01,
  UPGRADE_QUERY: 0x00,
  UPGRADE_START: 0x01,
  UPGRADE_DATA: 0x02,
  UPGRADE_END: 0x03,
  UPGRADE_ABORT: 0x04,
  MIN_FRAME_SIZE: 64,
  MAX_FRAME_SIZE: 1024
});

const CC_RESPONSE_TIMEOUT_MS = 15000;
const CC_START_TIMEOUT_MS = 60000;
const CC_END_TIMEOUT_MS = 60000;
const CC_MAX_RETRIES = 10;
const UPGRADE_IMAGE_MAGIC = 0xbeaf5aa5;
const UPGRADE_DEVICE_ID = 0x6750;
const CC_UI_VERSION = 6;

const INTERFACE_HINTS = {
  0: {
    name: 'KBD 键鼠',
    auto: false,
    note: 'HID 接口。Windows 键鼠驱动通常占用；尝试 claim 可能会暂时影响键鼠输入。'
  },
  1: {
    name: 'CC Control Center',
    auto: true,
    note: '调试与固件升级接口，IN 0x82 / OUT 0x02；帧长按端点描述符自动适配。'
  },
  2: {
    name: 'Lighting',
    auto: false,
    note: 'HID 灯效接口，描述符只暴露 IN 端点；输出通常走 HID SET_REPORT。'
  },
  3: {
    name: 'DT Diagnostic Tracking',
    auto: true,
    note: '诊断日志接口，IN 0x84 / OUT 0x04；设备协议不经过此接口。'
  }
};

const $status = document.getElementById('status');
const $interfaces = document.getElementById('interfaces');
const $log = document.getElementById('log');
const $traffic = document.getElementById('traffic');
const $displayMode = document.getElementById('displayMode');
const $inputMode = document.getElementById('inputMode');
const $chkLf = document.getElementById('chkLf');
const $chkAll = document.getElementById('chkAllInterfaces');
const $firmwareFile = document.getElementById('firmwareFile');
const $btnFirmwareStart = document.getElementById('btnFirmwareStart');
const $btnFirmwareCancel = document.getElementById('btnFirmwareCancel');
const $firmwareState = document.getElementById('firmwareState');
const $firmwareProgress = document.getElementById('firmwareProgress');
const $firmwareMeta = document.getElementById('firmwareMeta');
const $firmwareDuration = document.getElementById('firmwareDuration');
const $ccPacketInfo = document.getElementById('ccPacketInfo');
const $ccDeviceInfo = document.getElementById('ccDeviceInfo');
const $btnCcQuery = document.getElementById('btnCcQuery');
const $kcLayer = document.getElementById('kcLayer');
const $kcState = document.getElementById('kcState');
const $keyboard = document.getElementById('keyboard');
const $btnKcReadLayer = document.getElementById('btnKcReadLayer');
const $pickerTabs = document.getElementById('pickerTabs');
const $pickerGroups = document.getElementById('pickerGroups');
const btnConnect = document.getElementById('btnConnect');
const btnDisconnect = document.getElementById('btnDisconnect');

let device = null;
let links = [];
let session = 0;
let rxBytes = 0;
let txBytes = 0;
let firmwareSession = null;
let firmwareStarting = false;
let firmwareProgressUpdatedAt = 0;
let firmwareStartedAt = 0;
let firmwareDurationTimer = 0;
let firmwareLastDurationMs = 0;
let ccQueryPromise = null;
let kcBusy = false;
let kcSelected = null;
const kcValues = new Map();
const kcKeyEls = new Map();

function nowText() {
  return new Date().toLocaleTimeString('zh-CN', { hour12: false });
}

function appendLine(text, className = '') {
  const line = document.createElement('span');
  if (className) line.className = className;
  line.textContent = `${nowText()} ${text}\n`;
  $log.appendChild(line);
  if ($log.textContent.length > MAX_LOG_CHARS) {
    $log.textContent = $log.textContent.slice(-MAX_LOG_CHARS);
  }
  $log.scrollTop = $log.scrollHeight;
}

function asUint8Array(data) {
  if (data instanceof Uint8Array) return data;
  if (ArrayBuffer.isView(data)) {
    return new Uint8Array(data.buffer, data.byteOffset, data.byteLength);
  }
  return new Uint8Array(data);
}

function toHex(data) {
  return Array.from(asUint8Array(data))
    .map(v => v.toString(16).padStart(2, '0'))
    .join(' ');
}

function formatData(data) {
  if ($displayMode.value === 'hex') return toHex(data);
  return new TextDecoder('utf-8').decode(data);
}

function parseHex(text) {
  const normalized = text
    .replace(/0x/gi, '')
    .replace(/[\s,;:_-]+/g, '');
  if (!normalized || normalized.length % 2 !== 0 || !/^[0-9a-f]+$/i.test(normalized)) {
    throw new Error('HEX 数据必须由偶数个十六进制字符组成');
  }
  const out = new Uint8Array(normalized.length / 2);
  for (let i = 0; i < out.length; i++) {
    out[i] = parseInt(normalized.slice(i * 2, i * 2 + 2), 16);
  }
  return out;
}

function encodeInput(text) {
  let data = $inputMode.value === 'hex'
    ? parseHex(text)
    : new TextEncoder().encode($chkLf.checked ? text + '\n' : text);
  if (data.length === 0) throw new Error('发送内容不能为空');
  return data;
}

function endpointType(type) {
  return type === 'interrupt' ? '中断' : type === 'bulk' ? '批量' : type;
}

function endpointKey(ep) {
  return `${ep.direction}:${ep.endpointNumber}`;
}

function endpoinTag(ep) {
  const address = ep.endpointNumber | (ep.direction === 'in' ? 0x80 : 0x00);
  return `${ep.direction.toUpperCase()} 0x${address.toString(16).padStart(2, '0')}`;
}

/* ------------------------------------------------------------ Rot-Gen 帧 */

function readLe16(data, offset) {
  return data[offset] | (data[offset + 1] << 8);
}

function readLe32(data, offset) {
  return (data[offset] |
          (data[offset + 1] << 8) |
          (data[offset + 2] << 16) |
          (data[offset + 3] << 24)) >>> 0;
}

function writeLe16(data, offset, value) {
  data[offset] = value & 0xff;
  data[offset + 1] = (value >>> 8) & 0xff;
}

function writeLe32(data, offset, value) {
  data[offset] = value & 0xff;
  data[offset + 1] = (value >>> 8) & 0xff;
  data[offset + 2] = (value >>> 16) & 0xff;
  data[offset + 3] = (value >>> 24) & 0xff;
}

function rgCrc8(data) {
  let crc = 0;
  for (const byte of data) {
    crc ^= byte;
    for (let bit = 0; bit < 8; bit++) {
      crc = (crc & 0x80) ? ((crc << 1) ^ 0x07) : (crc << 1);
      crc &= 0xff;
    }
  }
  return crc;
}

function rgCrc16Update(crc, data) {
  for (const byte of data) {
    crc ^= byte << 8;
    for (let bit = 0; bit < 8; bit++) {
      crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) : (crc << 1);
      crc &= 0xffff;
    }
  }
  return crc;
}

function packCcMessage(cmd, subcmd, reserve = 0, payload = new Uint8Array()) {
  const msg = new Uint8Array(CC.HEADER_SIZE + payload.length);
  msg[0] = cmd;
  msg[1] = subcmd;
  writeLe16(msg, 2, reserve);
  msg.set(payload, CC.HEADER_SIZE);
  return msg;
}

function parseCcMessage(payload) {
  const msg = asUint8Array(payload);
  if (msg.length < CC.HEADER_SIZE) return null;
  return {
    cmd: msg[0],
    subcmd: msg[1],
    reserve: readLe16(msg, 2),
    payload: msg.subarray(CC.HEADER_SIZE)
  };
}

function makeRotGenFrame(payload, options = RG.OPT_REQUEST) {
  const frame = new Uint8Array(RG.HEADER_SIZE + payload.length);
  frame[0] = RG.SOF;
  frame[1] = RG.VERSION;
  frame[2] = options;
  frame[3] = RG.ADDR_CC;
  frame[4] = RG.ADDR_KEYBOARD;
  writeLe16(frame, 5, payload.length);
  writeLe16(frame, 7, RG.SECRET_KEY);
  frame[RG.CRC8_OFFSET] = rgCrc8(frame.subarray(0, RG.CRC8_OFFSET));
  frame.set(payload, RG.HEADER_SIZE);

  let crc = rgCrc16Update(0, frame.subarray(0, RG.CRC16_OFFSET));
  crc = rgCrc16Update(crc, frame.subarray(RG.HEADER_SIZE));
  writeLe16(frame, RG.CRC16_OFFSET, crc);
  return frame;
}

function parseRotGenFrame(data) {
  const frame = asUint8Array(data);
  if (frame.length < RG.HEADER_SIZE ||
      frame[0] !== RG.SOF ||
      frame[1] !== RG.VERSION) {
    return null;
  }
  const payloadLength = readLe16(frame, 5);
  if (RG.HEADER_SIZE + payloadLength !== frame.length) return null;
  if (rgCrc8(frame.subarray(0, RG.CRC8_OFFSET)) !== frame[RG.CRC8_OFFSET]) {
    return null;
  }
  let crc = rgCrc16Update(0, frame.subarray(0, RG.CRC16_OFFSET));
  crc = rgCrc16Update(crc, frame.subarray(RG.HEADER_SIZE));
  if (crc !== readLe16(frame, RG.CRC16_OFFSET)) return null;

  return {
    options: frame[2],
    src: frame[3],
    dst: frame[4],
    payload: frame.subarray(RG.HEADER_SIZE)
  };
}

function ccMaxDataSize(packetSize) {
  return packetSize - RG.HEADER_SIZE - CC.HEADER_SIZE - 2;
}

function ccStatusText(status) {
  if (status === 0) return '成功';
  const group = Math.floor(status / 512);
  const code = status % 512;
  if (group === 0) {
    const common = ['成功', '失败', '超时', '参数错误', '不支持', '未找到'];
    return common[code] || `通用错误 0x${status.toString(16)}`;
  }
  if (group === 3) {
    const hal = ['', '参数错误', '启动失败', '端点忙', '设备未就绪'];
    return hal[code] || `HAL 错误 0x${status.toString(16)}`;
  }
  if (group === 4) {
    const rotcc = ['', '初始化失败', '未初始化', '发送超时', '发送锁失败'];
    return rotcc[code] || `CC 错误 0x${status.toString(16)}`;
  }
  if (group === 6) {
    const upgrade = [
      '', '升级初始化失败', '升级未初始化', '升级忙', '升级槽无效',
      '文件头无效', '镜像过大', '数据不完整', '校验失败',
      '镜像无效', '升级记录无效', '镜像验证失败',
      'BootROM 双槽布局不匹配', '需要 EXIP 镜像'
    ];
    return upgrade[code] || `升级错误 0x${status.toString(16)}`;
  }
  return `设备错误 0x${status.toString(16).padStart(8, '0')}`;
}

function kcCacheKey(layer, index) {
  return `${layer}:${index}`;
}

/* ----------------------------------------------------------- CC 客户端 */

class CcAbortError extends Error {
  constructor(message = 'CC 传输已取消') {
    super(message);
    this.name = 'CcAbortError';
  }
}

class CcClient {
  constructor({ packetSize, write, log }) {
    if (!Number.isInteger(packetSize) || packetSize < CC.MIN_FRAME_SIZE) {
      throw new Error(`CC 端点包大小无效：${packetSize}`);
    }
    this.packetSize = packetSize;
    this.write = write;
    this.log = log;
    this.responses = [];
    this.waiter = null;
    this.cancelled = false;
  }

  receive(data) {
    if (this.cancelled) return;
    const frame = parseRotGenFrame(data);
    if (!frame) {
      this.log(`忽略格式或 CRC 无效的响应：${toHex(data)}`, 'warn');
      return;
    }
    if ((frame.options & RG.OPT_REQUEST) !== 0) return;
    const msg = parseCcMessage(frame.payload);
    if (!msg) {
      this.log('忽略缺少 Rot-CC 头的响应', 'warn');
      return;
    }
    this.responses.push(msg);
    this.pump();
  }

  cancel() {
    if (this.cancelled) return;
    this.cancelled = true;
    this.settleWaiter(new CcAbortError());
  }

  settleWaiter(error, value) {
    const waiter = this.waiter;
    if (!waiter) return;
    clearTimeout(waiter.timer);
    this.waiter = null;
    if (error) waiter.reject(error);
    else waiter.resolve(value);
  }

  pump() {
    const waiter = this.waiter;
    if (!waiter) return;

    while (this.responses.length > 0) {
      const msg = this.responses.shift();
      if (msg.cmd !== waiter.cmd || msg.subcmd !== waiter.subcmd) {
        this.log(
          `忽略过期响应 cmd=0x${msg.cmd.toString(16)} ` +
          `subcmd=0x${msg.subcmd.toString(16)}`,
          'warn'
        );
        continue;
      }
      this.settleWaiter(null, msg);
      return;
    }
  }

  waitResponse(cmd, subcmd, timeoutMs, label) {
    if (this.cancelled) return Promise.reject(new CcAbortError());
    if (this.waiter) {
      return Promise.reject(new Error('CC 接收状态冲突：已有等待中的响应'));
    }

    return new Promise((resolve, reject) => {
      const waiter = { cmd, subcmd, label, resolve, reject, timer: 0 };
      this.waiter = waiter;
      waiter.timer = setTimeout(() => {
        if (this.waiter !== waiter) return;
        this.waiter = null;
        reject(new Error(`${label}超时（${timeoutMs / 1000} 秒）`));
      }, timeoutMs);
      this.pump();
    });
  }

  checkCancelled() {
    if (this.cancelled) throw new CcAbortError();
  }

  async request(cmd, subcmd, options = {}) {
    const {
      reserve = 0,
      payload = new Uint8Array(),
      label = `cmd=0x${cmd.toString(16)} subcmd=0x${subcmd.toString(16)}`,
      timeoutMs = CC_RESPONSE_TIMEOUT_MS
    } = options;

    const frame = makeRotGenFrame(packCcMessage(cmd, subcmd, reserve, payload));
    if (frame.length > this.packetSize) {
      throw new Error(`${label} 帧长 ${frame.length} 超过端点 MPS ${this.packetSize}`);
    }

    let lastError = null;
    for (let attempt = 1; attempt <= CC_MAX_RETRIES; attempt++) {
      this.checkCancelled();
      await this.write(frame, `${label}（第 ${attempt} 次）`);
      try {
        return await this.waitResponse(cmd, subcmd, timeoutMs, `${label}响应`);
      } catch (error) {
        if (this.cancelled || error instanceof CcAbortError) throw error;
        lastError = error;
        this.log(
          `${label} 失败，重试 ${attempt}/${CC_MAX_RETRIES}：` +
          `${error.message || error}`,
          'warn'
        );
      }
    }
    throw lastError || new Error(`${label} 发送失败`);
  }

  async statusRequest(cmd, subcmd, options = {}) {
    const response = await this.request(cmd, subcmd, options);
    if (response.payload.length !== 4) {
      throw new Error(`${options.label || '请求'}响应长度异常`);
    }
    const status = readLe32(response.payload, 0);
    if (status !== 0) {
      throw new Error(
        `${options.label || '请求'}失败：${ccStatusText(status)}`
      );
    }
    return response;
  }

  async readPayload(cmd, subcmd, minLength, options = {}) {
    const response = await this.request(cmd, subcmd, options);
    if (response.payload.length >= minLength) {
      return response.payload;
    }
    if (response.payload.length === 4) {
      throw new Error(
        `${options.label || '请求'}失败：` +
        `${ccStatusText(readLe32(response.payload, 0))}`
      );
    }
    throw new Error(`${options.label || '请求'}响应长度异常`);
  }
}

class CcUpgradeClient extends CcClient {
  constructor({ bytes, sessionId, packetSize, write, log, onProgress }) {
    super({ packetSize, write, log });
    this.bytes = bytes;
    this.sessionId = sessionId;
    this.maxDataSize = ccMaxDataSize(packetSize);
    if (this.maxDataSize < 1) {
      throw new Error(`端点 MPS ${packetSize} 不足以承载升级数据帧`);
    }
    this.onProgress = onProgress;
  }

  async run() {
    const startPayload = new Uint8Array(8);
    writeLe32(startPayload, 0, this.bytes.length);
    writeLe32(startPayload, 4, this.sessionId);

    this.log(
      `开始升级会话 0x${this.sessionId.toString(16).padStart(8, '0')}，` +
      `${this.bytes.length} 字节；端点 MPS=${this.packetSize} B，` +
      `单帧数据=${this.maxDataSize} B`
    );
    await this.statusRequest(CC.CMD_UPGRADE, CC.UPGRADE_START, {
      payload: startPayload,
      label: 'START',
      timeoutMs: CC_START_TIMEOUT_MS
    });

    let offset = 0;
    let seq = 0;
    while (offset < this.bytes.length) {
      this.checkCancelled();
      const end = Math.min(offset + this.maxDataSize, this.bytes.length);
      const chunk = this.bytes.subarray(offset, end);
      const payload = new Uint8Array(2 + chunk.length);
      writeLe16(payload, 0, seq);
      payload.set(chunk, 2);

      await this.statusRequest(CC.CMD_UPGRADE, CC.UPGRADE_DATA, {
        payload,
        label: `DATA seq=${seq} @ ${offset}`
      });
      offset = end;
      this.onProgress(offset, this.bytes.length);
      seq = (seq + 1) & 0xffff;
    }

    this.log('文件数据已全部确认，请求设备校验并提交');
    await this.statusRequest(CC.CMD_UPGRADE, CC.UPGRADE_END, {
      payload: new Uint8Array(),
      label: 'END',
      timeoutMs: CC_END_TIMEOUT_MS
    });
    this.onProgress(this.bytes.length, this.bytes.length);
    this.log('设备校验完成，即将重启');
  }
}

/* --------------------------------------------------------- 端点与目标 */

function ccEndpointLimit(ep) {
  if (!ep || !['interrupt', 'bulk'].includes(ep.type)) {
    throw new Error(`CC 端点类型不受支持：${ep?.type || '未知'}`);
  }
  if (device?.speed === 'full' || device?.speed === 'low') {
    return 64;
  }
  if (device?.speed === 'high') {
    return ep.type === 'bulk' ? 512 : 1024;
  }
  /* Some WebUSB implementations omit USBDevice.speed. In that case the
   * endpoint descriptor's packetSize is the authoritative capability. */
  return CC.MAX_FRAME_SIZE;
}

function validateCcEndpointPair(link, epOut, epIn) {
  if (!epOut || !epIn) {
    throw new Error('CC 调试需要同时具备 IN 和 OUT 端点');
  }

  for (const ep of [epIn, epOut]) {
    if (!Number.isInteger(ep.packetSize) || ep.packetSize <= 0) {
      throw new Error(`${endpoinTag(ep)} 的 packetSize 无效`);
    }
    if (ep.packetSize < CC.MIN_FRAME_SIZE) {
      throw new Error(
        `${endpoinTag(ep)} 只有 ${ep.packetSize} 字节，` +
        `无法容纳 ${CC.MIN_FRAME_SIZE} 字节 Rot-Gen 帧`
      );
    }
    if ((ep.packetSize & (ep.packetSize - 1)) !== 0) {
      throw new Error(
        `${endpoinTag(ep)} 的 packetSize=${ep.packetSize} 不是 2 的幂`
      );
    }
    if (ep.packetSize > CC.MAX_FRAME_SIZE) {
      throw new Error(
        `${endpoinTag(ep)} 的 packetSize=${ep.packetSize} 超过协议上限 ` +
        `${CC.MAX_FRAME_SIZE}`
      );
    }
    const limit = ccEndpointLimit(ep);
    if (ep.packetSize > limit) {
      throw new Error(
        `${endpoinTag(ep)} 的 packetSize=${ep.packetSize} 超过当前 ` +
        `${device?.speed || '未知'} USB 速度上限 ${limit}`
      );
    }
  }

  const packetSize = Math.min(epIn.packetSize, epOut.packetSize);
  return {
    link,
    epIn,
    epOut,
    packetSize,
    maxDataSize: ccMaxDataSize(packetSize)
  };
}

function findCcTarget() {
  const link = links.find(item => item.number === 1) ||
               links.find(item => item.alt.endpoints.some(
                 ep => ep.endpointNumber === 2 &&
                       (ep.direction === 'out' || ep.direction === 'in')
               ));
  if (!link) return null;

  const epOut = link.alt.endpoints.find(
    ep => ep.direction === 'out' && ep.endpointNumber === 2
  );
  const epIn = link.alt.endpoints.find(
    ep => ep.direction === 'in' && ep.endpointNumber === 2
  );
  return epOut && epIn ? validateCcEndpointPair(link, epOut, epIn) : null;
}

function updateCcPacketInfo() {
  if (!links.length) {
    $ccPacketInfo.textContent = '等待读取设备端点';
    return;
  }
  try {
    const target = findCcTarget();
    if (!target) {
      $ccPacketInfo.textContent = '未找到 CC IN/OUT 端点';
      return;
    }
    const speed = device?.speed === 'high'
      ? 'HS'
      : (device?.speed || 'speed=unknown');
    const pair = target.epIn.packetSize === target.epOut.packetSize
      ? `MPS ${target.packetSize} B`
      : `MPS ${target.epIn.packetSize}/${target.epOut.packetSize} B`;
    $ccPacketInfo.textContent =
      `Rot-Gen v${RG.VERSION} · UI v${CC_UI_VERSION} · ${speed} · ${pair}` +
      ` · DATA ${target.maxDataSize} B`;
  } catch (error) {
    $ccPacketInfo.textContent = `CC 端点不受支持：${error.message || error}`;
  }
}

/* ------------------------------------------------------------ 调试请求 */

async function writeCcFrame(target, data, label) {
  if (!device || !device.opened || !target.link.claimed) {
    throw new Error(`Interface ${target.link.number} 不可用`);
  }
  if (data.length > target.packetSize) {
    throw new Error(`CC 帧超过端点 MPS ${target.packetSize} 字节`);
  }
  const result = await device.transferOut(target.epOut.endpointNumber, data);
  if (result.status !== 'ok') {
    throw new Error(`transferOut status=${result.status}`);
  }
  if (result.bytesWritten !== data.length) {
    throw new Error(
      `transferOut 只提交了 ${result.bytesWritten}/${data.length} 字节`
    );
  }
  txBytes += data.length;
  $traffic.textContent = `RX ${rxBytes} B · TX ${txBytes} B`;

  const msg = parseCcMessage(data.subarray(RG.HEADER_SIZE));
  const logAlways = !msg ||
    msg.cmd !== CC.CMD_UPGRADE ||
    msg.subcmd !== CC.UPGRADE_DATA;
  const seq = msg?.payload.length >= 2 ? readLe16(msg.payload, 0) : 0;
  if (logAlways || seq === 0 || (seq & 0x3f) === 0) {
    appendLine(
      `[CC TX IF${target.link.number} ${endpoinTag(target.epOut)} ` +
      `${data.length}B] ${label}`
    );
  }
}

async function makeCcClient(target, { bytes = null, onProgress = null } = {}) {
  const write = (data, label) => writeCcFrame(target, data, label);
  const log = (text, className = '') => appendLine(`[CC] ${text}`, className);

  if (!target.link.claimed) {
    const claimed = await claimLink(target.link);
    if (!claimed || !target.link.claimed) {
      throw new Error(`Interface ${target.link.number} 占用失败`);
    }
  }

  if (bytes) {
    return new CcUpgradeClient({
      bytes,
      sessionId: makeSessionId(),
      packetSize: target.packetSize,
      write,
      log,
      onProgress
    });
  }
  return new CcClient({ packetSize: target.packetSize, write, log });
}

/* 一次性请求：临时挂接收、发完即摘。 */
async function ccCall(target, handler) {
  const key = endpointKey(target.epIn);
  if (target.link.rxHandlers.has(key)) {
    throw new Error('CC 接收通道正在被其他功能使用');
  }

  let client = null;
  let result = null;
  let failure = null;
  const forward = data => {
    if (client) client.receive(data);
  };

  target.link.rxHandlers.set(key, forward);
  if (!target.link.reads.has(key)) {
    startRead(target.link, target.epIn);
  }

  try {
    client = await makeCcClient(target);
    result = await handler(client);
  } catch (error) {
    failure = error;
  } finally {
    if (client) client.cancel();
    if (target.link.rxHandlers.get(key) === forward) {
      target.link.rxHandlers.delete(key);
    }
  }

  if (failure) throw failure;
  return result;
}

function makeSessionId() {
  if (globalThis.crypto?.getRandomValues) {
    const value = new Uint32Array(1);
    globalThis.crypto.getRandomValues(value);
    if (value[0] !== 0) return value[0];
  }
  const fallback = (Date.now() ^ Math.floor(Math.random() * 0xffffffff)) >>> 0;
  return fallback || 1;
}

/* ------------------------------------------------------------ 设备信息 */

function formatSwVersion(version) {
  return `${version} (0x${version.toString(16).padStart(4, '0')})`;
}

function formatFwVersion64(value) {
  const major = Number((value >> 56n) & 0xffn);
  const minor = Number((value >> 46n) & 0x3ffn);
  const patch = Number((value >> 36n) & 0x3ffn);
  return `v${major}.${minor}.${patch}`;
}

function decodeDeviceInfo(payload) {
  const view = new DataView(
    payload.buffer, payload.byteOffset, payload.byteLength
  );
  const text = (offset, length) => {
    let out = '';
    for (let i = 0; i < length; i++) {
      const byte = payload[offset + i];
      if (byte === 0) break;
      out += String.fromCharCode(byte);
    }
    return out;
  };

  return {
    vid: view.getUint16(0, true),
    pid: view.getUint16(2, true),
    pn: text(4, 16),
    sn: text(20, 16),
    fwVersion: view.getBigUint64(36, true),
    hwVersion: payload[44]
  };
}

function decodeUpgradeInfo(payload) {
  const flags = payload[18];
  const slotVersion = [readLe16(payload, 8), readLe16(payload, 10)];
  return {
    protocolVersion: payload[0],
    activeSlot: payload[1],
    slotValid: [payload[2] !== 0, payload[3] !== 0],
    slotRetired: [(flags & 0x08) !== 0, (flags & 0x10) !== 0],
    slotRecordValid: [(flags & 0x20) !== 0, (flags & 0x40) !== 0],
    version: readLe16(payload, 4),
    headerLength: readLe16(payload, 6),
    slotVersion,
    slotAppVersion: [readLe16(payload, 24), readLe16(payload, 26)],
    otpSecImgOffset: readLe16(payload, 12),
    otpMaxImgLen: readLe16(payload, 14),
    configuredSlotSize256k: readLe16(payload, 16),
    remapEnabled: (flags & 0x01) !== 0,
    bootOtaEnabled: (flags & 0x02) !== 0,
    bootLayoutMatches: (flags & 0x04) !== 0,
    exipEnabled: (flags & 0x80) !== 0,
    firmwareVersion: readLe32(payload, 20)
  };
}

function applyCcDeviceInfo(deviceInfo, upgradeInfo) {
  const slots = upgradeInfo ? [0, 1].map(index => {
    const name = `APP${index + 1}`;
    const notes = [];
    if (!upgradeInfo.slotValid[index]) notes.push('槽头无效');
    if (!upgradeInfo.slotRecordValid[index]) notes.push('应用记录无效');
    if (upgradeInfo.slotRetired[index]) notes.push('已退役');
    const status = notes.length ? `（${notes.join('，')}）` : '';
    return `${name} 应用版本 ${upgradeInfo.slotAppVersion[index]}，` +
      `SW_VERSION=${formatSwVersion(upgradeInfo.slotVersion[index])}${status}`;
  }) : [];

  const bootMode = !upgradeInfo
    ? '槽位信息不可用'
    : upgradeInfo.bootOtaEnabled
      ? (upgradeInfo.bootLayoutMatches
        ? `BootROM 双槽布局匹配 (${upgradeInfo.otpSecImgOffset} x 256 KiB)`
        : `BootROM 布局不匹配 (OTP ${upgradeInfo.otpSecImgOffset} x 256 KiB / ` +
          `配置 ${upgradeInfo.configuredSlotSize256k} x 256 KiB)`)
      : 'BootROM 双槽未启用 (OTP SEC_IMG_OFFSET=0)';

  const head =
    `PN ${deviceInfo.pn || '--'} · SN ${deviceInfo.sn || '--'} · ` +
    `FW ${formatFwVersion64(deviceInfo.fwVersion)} · ` +
    `VID 0x${deviceInfo.vid.toString(16).padStart(4, '0')} ` +
    `PID 0x${deviceInfo.pid.toString(16).padStart(4, '0')} · ` +
    `HW ${deviceInfo.hwVersion}`;
  const slotsText = upgradeInfo
    ? `当前 APP${upgradeInfo.activeSlot} · ` +
      `固件版本 ${upgradeInfo.firmwareVersion} · ` +
      `SW_VERSION ${formatSwVersion(upgradeInfo.version)}`
    : '';
  $ccDeviceInfo.textContent = [head, slotsText, ...slots, bootMode]
    .filter(text => text)
    .join(' · ');

  appendLine(
    `[CC INFO] ${head}`
  );
  if (upgradeInfo) {
    appendLine(
      `[CC INFO] 当前 APP${upgradeInfo.activeSlot}，查询协议=v` +
      `${upgradeInfo.protocolVersion}，SW_VERSION=` +
      `${formatSwVersion(upgradeInfo.version)}，${slots[0]}，${slots[1]}，` +
      `${bootMode}，remap=${upgradeInfo.remapEnabled ? 1 : 0} ` +
      `exip=${upgradeInfo.exipEnabled ? 1 : 0}`
    );
  }
}

async function queryCcDeviceInfo({ silent = false } = {}) {
  if (ccQueryPromise) return ccQueryPromise;
  if (!device || !device.opened) {
    throw new Error('请先连接设备');
  }
  if (isFirmwareActive()) {
    throw new Error('固件传输期间不能查询设备信息');
  }

  ccQueryPromise = (async () => {
    const target = findCcTarget();
    if (!target) throw new Error('没有找到 CC IN/OUT 端点');

    return ccCall(target, async client => {
      const devicePayload = await client.readPayload(
        CC.CMD_SYS, CC.SYS_INFO, 45, { label: '设备信息' }
      );
      const deviceInfo = decodeDeviceInfo(devicePayload);

      let upgradeInfo = null;
      try {
        const payload = await client.readPayload(
          CC.CMD_UPGRADE, CC.UPGRADE_QUERY, 24, { label: '槽位信息' }
        );
        upgradeInfo = decodeUpgradeInfo(payload);
      } catch (error) {
        appendLine(`[CC INFO] 槽位信息查询失败：${error.message || error}`, 'warn');
      }

      applyCcDeviceInfo(deviceInfo, upgradeInfo);
      return { deviceInfo, upgradeInfo };
    });
  })();
  refreshControls();

  try {
    return await ccQueryPromise;
  } catch (error) {
    $ccDeviceInfo.textContent = `查询失败：${error.message || error}`;
    if (!silent) {
      appendLine(`[CC INFO 失败] ${error.message || error}`, 'err');
    }
    throw error;
  } finally {
    ccQueryPromise = null;
    refreshControls();
  }
}

  0x85: 'MainMenu', 0x86: 'AppMenu', 0x87: 'Help', 0x88: 'Exit',
};

function kcDescribe(code) {
  const type = (code >>> 1) & 0x1f;
  const usage = (code >>> 24) & 0xff;
  switch (type) {
    case 0:
      return KC_USAGE_NAMES[usage] || `KBD 0x${usage.toString(16).padStart(2, '0')}`;
    case 1:
      return KC_SYS_NAMES[usage] || `SYS 0x${usage.toString(16).padStart(2, '0')}`;
    case 2:
      return `CSM 0x${((code >>> 16) & 0xffff).toString(16).padStart(4, '0')}`;
    case 3:
      return `ADV 0x${((code >>> 16) & 0xffff).toString(16).padStart(4, '0')}`;
    case 4:
      return `MS 0x${((code >>> 16) & 0xffff).toString(16).padStart(4, '0')}`;
    case 5:
      return `GP 0x${((code >>> 16) & 0xffff).toString(16).padStart(4, '0')}`;
    case 6: {
      const sub = (code >>> 6) & 0x1f;
      const detail = (code >>> 16) & 0xffff;
      return `FN${sub}:${detail.toString(16).padStart(4, '0')}`;
    }
    default:
      return `0x${(code >>> 0).toString(16).padStart(8, '0')}`;
  }
}

const KC_BUILDERS = {
  KBD: usage => ((usage << 24) | (0 << 1)) >>> 0,
  SYS: usage => ((usage << 24) | (1 << 1)) >>> 0,
  CSM: usage => ((usage << 16) | (2 << 1)) >>> 0,
  MS: usage => ((usage << 16) | (4 << 1)) >>> 0,
  FN_KEY: usage => ((usage << 16) | (0 << 6) | (6 << 1)) >>> 0,
  FN_LIGHT: usage => ((usage << 16) | (1 << 6) | (6 << 1)) >>> 0,
  FN_BT: usage => ((usage << 16) | (2 << 6) | (6 << 1)) >>> 0,
  FN_RADIO: usage => ((usage << 16) | (3 << 6) | (6 << 1)) >>> 0,
  FN_DISP: usage => ((usage << 16) | (4 << 6) | (6 << 1)) >>> 0,
  FN_SHCT: usage => ((usage << 16) | (5 << 6) | (6 << 1)) >>> 0,
};

const BOARD_BASE = { main: 0, nav: 66, num: 80 };

function renderPickerBoard(root, rows) {
  const board = document.createElement('div');
  board.className = 'board';

  for (const row of rows) {
    for (const [section, keys] of [
      ['main', row.main],
      ['nav', row.nav],
      ['num', row.num],
    ]) {
      for (const [name, usage, quarter, span, rowSpan = 1] of keys) {
        const code = KC_BUILDERS.KBD(usage);
        const label = name.replace('\n', ' ');
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'board-key';
        btn.textContent = name;
        btn.title = `${label} · 0x${code.toString(16).padStart(8, '0')}`;
        btn.style.gridColumn = `${1 + BOARD_BASE[section] + quarter} / span ${span}`;
        btn.style.gridRow = `${row.row} / span ${rowSpan}`;
        btn.addEventListener('click', () => assignKeycode(code, label));
        board.appendChild(btn);
      }
    }
  }

  root.appendChild(board);
  syncBoardSize();
}

/* 1u 键帽取正方形：按面板可用宽高（24u × 6u）算出最大边长，过小时保底并允许滚动。 */
function syncBoardSize() {
  const board = $pickerGroups;
  if (!board.classList.contains('picker-board')) return;
  const style = getComputedStyle(board);
  const width = board.clientWidth -
    parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
  const height = board.clientHeight -
    parseFloat(style.paddingTop) - parseFloat(style.paddingBottom);
  if (width <= 0 || height <= 0) return;

  const unit = Math.max(20, Math.floor(Math.min(width / 24, height / 6)));
  if (board.dataset.unit === String(unit)) return;
  board.dataset.unit = String(unit);
  board.style.setProperty('--key', `${unit}px`);
  board.style.setProperty('--q', `${unit / 4}px`);
  board.style.setProperty('--sg', `${unit / 2}px`);
}

function renderKeyboard() {
  $keyboard.textContent = '';
  kcKeyEls.clear();

  for (const row of KEY_ROWS) {
    const rowEl = document.createElement('div');
    rowEl.className = 'kb-row';
    rowEl.style.gridTemplateColumns = row.map(key => `${key[2]}fr`).join(' ');

    for (const [label, index, span] of row) {
      const keyEl = document.createElement('button');
      keyEl.type = 'button';
      keyEl.className = 'keycap';
      keyEl.dataset.index = String(index);
      keyEl.dataset.label = label;
      keyEl.setAttribute('aria-label', label);

      const valueEl = document.createElement('span');
      valueEl.className = 'kc-value';
      valueEl.textContent = '--';

      keyEl.appendChild(valueEl);
      keyEl.addEventListener('click', () => selectKey(index));

      rowEl.appendChild(keyEl);
      kcKeyEls.set(index, { root: keyEl, value: valueEl });
    }
    $keyboard.appendChild(rowEl);
  }
  syncKeycaps();
  syncKeycapSize();
}

/* 基础键宽跟随卡片高度收敛，保证键盘完整落在 1/3 区域内且键帽为正方形。 */
let keycapHeight = 0;

function syncKeycapSize() {
  const card = $keyboard.closest('.keyboard-card');
  const base = kcKeyEls.get(0)?.root;
  if (!base || !card) return;

  const avail = card.clientHeight - 32;
  if (card.clientHeight < 100) return;

  /* 4 行键帽 + 3 个 5px 行距，反推每行可用高度 */
  const fitted = Math.floor((avail - 15) / 4);
  const target = Math.max(18, Math.min(40, fitted));
  const maxWidth = 12 * target + 55;

  if ($keyboard.style.maxWidth !== `${maxWidth}px`) {
    $keyboard.style.maxWidth = `${maxWidth}px`;
  }

  const measured = Math.round(base.getBoundingClientRect().width);
  const height = measured > 0 ? measured : target;
  if (height !== keycapHeight) {
    keycapHeight = height;
    $keyboard.style.setProperty('--keycap-height', `${height}px`);
  }
}

function syncKeycaps() {
  const layer = Number($kcLayer.value);

  for (const [index, el] of kcKeyEls) {
    const code = kcValues.get(kcCacheKey(layer, index));
    const label = el.root.dataset.label;
    el.value.textContent = code === undefined ? '--' : kcDescribe(code);
    el.value.classList.toggle('set', code !== undefined);
    el.root.classList.toggle('selected', kcSelected === index);
    el.root.title = code === undefined
      ? `${label} · 索引 ${index}（未读取）`
      : `${label} · 索引 ${index} · 0x${(code >>> 0).toString(16).padStart(8, '0')} · ${kcDescribe(code)}`;
  }
}

function selectKey(index) {
  kcSelected = index;
  syncKeycaps();
  readKeycode(index);
}

async function readKeycode(index) {
  if (kcBusy || isFirmwareActive()) return;
  const layer = Number($kcLayer.value);
  const target = findCcTarget();
  if (!target) {
    appendLine('[KC] 没有找到 CC IN/OUT 端点', 'err');
    return;
  }

  kcBusy = true;
  refreshControls();
  try {
    const payload = await ccCall(target, client =>
      client.readPayload(CC.CMD_KC, CC.KC_GET, 4, {
        reserve: ((layer & 0xff) << 8) | (index & 0xff),
        label: `读取键码 L${layer} K${index}`,
        timeoutMs: 3000
      })
    );

    const code = readLe32(payload, 0);
    kcValues.set(kcCacheKey(layer, index), code);
    $kcState.textContent = `L${layer} K${index} · ${kcDescribe(code)}`;
    appendLine(
      `[KC] L${layer} K${index} = 0x${code.toString(16).padStart(8, '0')} ` +
      `(${kcDescribe(code)})`
    );
  } catch (error) {
    appendLine(`[KC] 读取失败：${error.message || error}`, 'err');
  } finally {
    kcBusy = false;
    syncKeycaps();
    refreshControls();
  }
}

async function readKeycodeLayer() {
  if (kcBusy || isFirmwareActive()) return;
  const layer = Number($kcLayer.value);
  const target = findCcTarget();
  if (!target) {
    appendLine('[KC] 没有找到 CC IN/OUT 端点', 'err');
    return;
  }

  kcBusy = true;
  refreshControls();
  try {
    await ccCall(target, async client => {
      let done = 0;
      for (const row of KEY_ROWS) {
        for (const [, index] of row) {
          const payload = await client.readPayload(CC.CMD_KC, CC.KC_GET, 4, {
            reserve: ((layer & 0xff) << 8) | (index & 0xff),
            label: `读取键码 L${layer} K${index}`,
            timeoutMs: 3000
          });
          kcValues.set(kcCacheKey(layer, index), readLe32(payload, 0));
          done++;
        }
        $kcState.textContent = `L${layer} 读取中 ${done}/42`;
        syncKeycaps();
      }
    });
    $kcState.textContent = `L${layer} 已读取 42 个键`;
    appendLine(`[KC] 已读取 L${layer} 全部键码`);
  } catch (error) {
    $kcState.textContent = `L${layer} 读取失败`;
    appendLine(`[KC] 读取本层失败：${error.message || error}`, 'err');
  } finally {
    kcBusy = false;
    syncKeycaps();
    refreshControls();
  }
}

/* 连接后自动读取当前层的全部键码，已缓存则跳过。 */
function autoReadKeymap() {
  if (!device?.opened || !links.length || isFirmwareActive()) return;
  const layer = Number($kcLayer.value);
  if (kcValues.has(kcCacheKey(layer, 0))) return;
  readKeycodeLayer();
}

/* 把选中的键码写到当前键盘选中的按键上。 */
async function assignKeycode(code, label) {
  if (kcBusy || isFirmwareActive()) return;
  const layer = Number($kcLayer.value);
  if (kcSelected === null) {
    $kcState.textContent = '先在键盘上选一个按键';
    appendLine('[KC] 请先在键盘上点选一个按键，再选择键码', 'warn');
    return;
  }
  const index = kcSelected;

  kcBusy = true;
  refreshControls();
  try {
    const target = findCcTarget();
    if (!target) throw new Error('没有找到 CC IN/OUT 端点');

    const payload = new Uint8Array(4);
    writeLe32(payload, 0, code);
    await ccCall(target, client =>
      client.statusRequest(CC.CMD_KC, CC.KC_SET, {
        reserve: ((layer & 0xff) << 8) | (index & 0xff),
        payload,
        label: `写入键码 L${layer} K${index}`,
        timeoutMs: 3000
      })
    );

    kcValues.set(kcCacheKey(layer, index), code);
    $kcState.textContent = `L${layer} K${index} ← ${label} · ${kcDescribe(code)}`;
    appendLine(
      `[KC] L${layer} K${index} <= ${label} 0x` +
      `${code.toString(16).padStart(8, '0')} (${kcDescribe(code)})`
    );
  } catch (error) {
    appendLine(`[KC] 写入失败：${error.message || error}`, 'err');
  } finally {
    kcBusy = false;
    syncKeycaps();
    refreshControls();
  }
}

/* ------------------------------------------------------------ 升级流程 */

function isFirmwareActive() {
  return firmwareStarting || firmwareSession !== null;
}

function formatByteCount(bytes) {
  if (bytes < 1024) return `${bytes} B`;
  if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KiB`;
  return `${(bytes / (1024 * 1024)).toFixed(2)} MiB`;
}

function monotonicNow() {
  return globalThis.performance?.now
    ? globalThis.performance.now()
    : Date.now();
}

function formatDuration(milliseconds) {
  const totalMs = Math.max(0, Math.round(milliseconds));
  if (totalMs < 60000) {
    return `${(totalMs / 1000).toFixed(2)} s`;
  }

  const totalSeconds = Math.floor(totalMs / 1000);
  const hours = Math.floor(totalSeconds / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);
  const seconds = totalSeconds % 60;
  const tenths = Math.floor((totalMs % 1000) / 100);
  if (hours > 0) {
    return `${hours}:${String(minutes).padStart(2, '0')}:` +
           `${String(seconds).padStart(2, '0')}.${tenths}`;
  }
  return `${minutes}:${String(seconds).padStart(2, '0')}.${tenths}`;
}

function renderFirmwareDuration(milliseconds) {
  $firmwareDuration.textContent =
    milliseconds > 0 ? `总用时 ${formatDuration(milliseconds)}` : '总用时 --';
}

function tickFirmwareDuration() {
  if (firmwareStartedAt === 0) return;
  firmwareLastDurationMs = monotonicNow() - firmwareStartedAt;
  renderFirmwareDuration(firmwareLastDurationMs);
}

function startFirmwareDuration() {
  if (firmwareDurationTimer) clearInterval(firmwareDurationTimer);
  firmwareLastDurationMs = 0;
  firmwareStartedAt = monotonicNow();
  $firmwareDuration.textContent = '总用时 0.00 s';
  firmwareDurationTimer = setInterval(tickFirmwareDuration, 100);
}

function stopFirmwareDuration() {
  if (firmwareDurationTimer) {
    clearInterval(firmwareDurationTimer);
    firmwareDurationTimer = 0;
  }
  if (firmwareStartedAt !== 0) {
    firmwareLastDurationMs = monotonicNow() - firmwareStartedAt;
    firmwareStartedAt = 0;
  }
  renderFirmwareDuration(firmwareLastDurationMs);
  return firmwareLastDurationMs;
}

function resetFirmwareDuration() {
  if (firmwareDurationTimer) {
    clearInterval(firmwareDurationTimer);
    firmwareDurationTimer = 0;
  }
  firmwareStartedAt = 0;
  firmwareLastDurationMs = 0;
  renderFirmwareDuration(0);
}

function setFirmwareState(text, className = '') {
  $firmwareState.textContent = text;
  $firmwareState.className = className;
}

function updateFirmwareProgress(done, total) {
  const now = Date.now();
  if (done > 0 && done < total && now - firmwareProgressUpdatedAt < 100) {
    return;
  }
  firmwareProgressUpdatedAt = now;
  $firmwareProgress.max = Math.max(1, total);
  $firmwareProgress.value = Math.min(done, total);
  const percent = total > 0 ? Math.floor(done * 100 / total) : 0;
  $firmwareMeta.textContent =
    `${formatByteCount(done)} / ${formatByteCount(total)} · ${percent}%`;
}

async function sendCcAbort(target) {
  if (!target || !device || !device.opened || !target.link.claimed) return;
  const frame = makeRotGenFrame(
    packCcMessage(CC.CMD_UPGRADE, CC.UPGRADE_ABORT)
  );
  await writeCcFrame(target, frame, 'ABORT').catch(error => {
    appendLine(`[CC] 发送取消帧失败：${error.message || error}`, 'warn');
  });
}

async function startFirmwareUpgrade() {
  if (isFirmwareActive()) return;
  const file = $firmwareFile.files[0];
  if (!file) {
    setFirmwareState('请选择升级文件。', 'err');
    return;
  }
  if (!device || !device.opened) {
    setFirmwareState('请先连接设备。', 'err');
    return;
  }

  firmwareStarting = true;
  startFirmwareDuration();
  let current = null;
  let target = null;
  let handlerKey = null;
  let succeeded = false;
  refreshControls();

  try {
    target = findCcTarget();
    if (!target) {
      throw new Error('没有找到 CC Interface 1 的 IN/OUT 端点');
    }
    appendLine(
      `[CC] 固件端点：IN=${target.epIn.packetSize} B，` +
      `OUT=${target.epOut.packetSize} B，USB=${device.speed || 'unknown'}，` +
      `单帧数据=${target.maxDataSize} B`
    );

    setFirmwareState(`读取文件 ${file.name} ...`);
    const bytes = new Uint8Array(await file.arrayBuffer());
    if (bytes.length < 16) {
      throw new Error('升级文件小于 16 字节，无法包含升级头');
    }
    if (readLe32(bytes, 0) !== UPGRADE_IMAGE_MAGIC) {
      throw new Error('升级文件头 magic 不匹配');
    }
    if (readLe32(bytes, 4) !== UPGRADE_DEVICE_ID) {
      throw new Error('升级文件头的设备 ID 不匹配');
    }
    if (readLe32(bytes, 8) === 0) {
      throw new Error('升级文件头的镜像长度为 0');
    }
    if (!device || !device.opened || !links.includes(target.link)) {
      throw new Error('设备已断开');
    }
    updateFirmwareProgress(0, bytes.length);

    current = await makeCcClient(target, {
      bytes,
      onProgress: updateFirmwareProgress
    });
    firmwareSession = current;
    refreshControls();

    handlerKey = endpointKey(target.epIn);
    target.link.rxHandlers.set(handlerKey, data => current.receive(data));
    if (!target.link.reads.has(handlerKey)) {
      startRead(target.link, target.epIn);
    }

    setFirmwareState(`正在通过 CC 升级 ${file.name}（${formatByteCount(bytes.length)}）...`);
    await current.run();
    succeeded = true;
    const durationMs = stopFirmwareDuration();
    setFirmwareState(
      `设备校验完成：${file.name}，总用时 ${formatDuration(durationMs)}`
    );
    appendLine(
      `[CC] ${file.name} 升级完成，共 ${bytes.length} 字节，` +
      `总用时 ${formatDuration(durationMs)}（${Math.round(durationMs)} ms）`,
      ''
    );
  } catch (error) {
    const durationMs = stopFirmwareDuration();
    if ((current && current.cancelled) || error instanceof CcAbortError) {
      setFirmwareState(
        `CC 传输已取消，总用时 ${formatDuration(durationMs)}`,
        'warn'
      );
      appendLine(
        `[CC] 传输已取消，总用时 ${formatDuration(durationMs)}` +
        `（${Math.round(durationMs)} ms）`,
        'warn'
      );
    } else {
      const message = error.message || String(error);
      setFirmwareState(
        `升级失败：${message}，总用时 ${formatDuration(durationMs)}`,
        'err'
      );
      appendLine(
        `[CC 失败] ${message}，总用时 ${formatDuration(durationMs)}` +
        `（${Math.round(durationMs)} ms）`,
        'err'
      );
    }
  } finally {
    stopFirmwareDuration();
    if (current && !succeeded) {
      await sendCcAbort(target);
    }
    if (target && handlerKey !== null) {
      target.link.rxHandlers.delete(handlerKey);
    }
    if (firmwareSession === current) firmwareSession = null;
    firmwareStarting = false;
    refreshControls();
  }
}

function cancelFirmwareUpgrade() {
  if (!firmwareSession) return;
  setFirmwareState('正在取消 CC 传输...', 'warn');
  firmwareSession.cancel();
}

/* ---------------------------------------------------------- 接口与收发 */

function makeButton(text, className = '') {
  const button = document.createElement('button');
  button.textContent = text;
  if (className) button.className = className;
  return button;
}

function renderInterfaces() {
  $interfaces.textContent = '';
  if (!links.length) {
    const empty = document.createElement('div');
    empty.className = 'interface';
    empty.innerHTML = '<div class="interface-head"><strong>尚无接口数据</strong></div>';
    $interfaces.appendChild(empty);
    return;
  }

  /* 已占用的接口排在前面，其余按接口号顺序。 */
  const ordered = [...links].sort(
    (a, b) => (b.claimed ? 1 : 0) - (a.claimed ? 1 : 0) || a.number - b.number
  );

  for (const link of ordered) {
    link.ui.clear();
    const hint = INTERFACE_HINTS[link.number] || {};
    const card = document.createElement('section');
    card.className = 'interface';

    const head = document.createElement('div');
    head.className = 'interface-head';
    const title = document.createElement('strong');
    title.textContent = `Interface ${link.number} · ${hint.name || '未命名接口'}`;
    head.appendChild(title);

    const cls = document.createElement('span');
    cls.className = 'grow';
    cls.textContent = `class=0x${link.interfaceClass.toString(16).padStart(2, '0')}`;
    cls.style.color = '#8b98a5';
    head.appendChild(cls);

    const claimButton = makeButton(link.claimed ? '释放接口' : '占用接口',
                                   link.claimed ? 'secondary' : '');
    claimButton.disabled = !device || !device.opened || isFirmwareActive();
    claimButton.addEventListener('click', async () => {
      if (isFirmwareActive()) return;
      if (link.claimed) await releaseLink(link);
      else await claimLink(link);
      refreshControls();
    });
    head.appendChild(claimButton);

    const claimState = document.createElement('span');
    claimState.className = `claim ${link.claimed ? 'ok' : ''}`;
    claimState.textContent = link.claimed ? '已占用' : '未占用';
    head.appendChild(claimState);
    card.appendChild(head);

    link.claimButton = claimButton;
    link.claimState = claimState;

    if (hint.note) {
      const hintNode = document.createElement('div');
      hintNode.className = 'hint';
      hintNode.textContent = hint.note;
      card.appendChild(hintNode);
    }

    const endpoints = document.createElement('div');
    endpoints.className = 'endpoints';
    if (!link.alt.endpoints.length) {
      const none = document.createElement('div');
      none.className = 'hint';
      none.textContent = '该接口没有端点';
      endpoints.appendChild(none);
    }

    for (const ep of link.alt.endpoints) {
      const row = document.createElement('div');
      row.className = 'endpoint';

      const line = document.createElement('div');
      line.className = 'endpoint-line';
      const name = document.createElement('span');
      name.className = 'endpoint-name';
      name.innerHTML = `<b>${endpoinTag(ep)}</b> · ` +
                       `${endpointType(ep.type)} · ${ep.packetSize} B`;
      line.appendChild(name);

      if (ep.direction === 'in') {
        const state = document.createElement('span');
        state.className = 'read-state';
        state.textContent = link.reads.has(endpointKey(ep)) ? '监听中' : '未监听';
        const start = makeButton('开始监听', 'secondary');
        start.disabled = !link.claimed || link.reads.has(endpointKey(ep));
        start.addEventListener('click', () => {
          startRead(link, ep);
          refreshControls();
        });
        line.appendChild(start);
        line.appendChild(state);
        link.ui.set(endpointKey(ep), { state, start });
      } else {
        const note = document.createElement('span');
        note.className = 'read-state';
        note.textContent = link.number === 3 ? '日志只读' : '可发送';
        line.appendChild(note);
        link.ui.set(endpointKey(ep), { note });
      }
      row.appendChild(line);

      if (ep.direction === 'out' && link.number !== 3) {
        const sendRow = document.createElement('div');
        sendRow.className = 'send-row';
        const input = document.createElement('input');
        input.placeholder = $inputMode.value === 'hex'
          ? '例如：01 02 0a ff'
          : '输入文本，按回车或点击发送';
        const send = makeButton('发送');
        send.disabled = !link.claimed || isFirmwareActive();
        input.disabled = isFirmwareActive();
        send.addEventListener('click', () => sendPacket(link, ep, input));
        input.addEventListener('keydown', event => {
          if (event.key === 'Enter') sendPacket(link, ep, input);
        });
        sendRow.appendChild(input);
        sendRow.appendChild(send);
        row.appendChild(sendRow);
        link.ui.get(endpointKey(ep)).send = send;
        link.ui.get(endpointKey(ep)).input = input;
      }

      endpoints.appendChild(row);
    }
    card.appendChild(endpoints);
    $interfaces.appendChild(card);
  }
}

function refreshControls() {
  const active = isFirmwareActive() || kcBusy || ccQueryPromise !== null;

  for (const link of links) {
    if (link.claimButton) {
      link.claimButton.textContent = link.claimed ? '释放接口' : '占用接口';
      link.claimButton.disabled = !device || !device.opened || isFirmwareActive();
      link.claimState.textContent = link.claimed ? '已占用' : '未占用';
      link.claimState.className = `claim ${link.claimed ? 'ok' : ''}`;
    }
    for (const ep of link.alt.endpoints) {
      const ui = link.ui.get(endpointKey(ep));
      if (!ui) continue;
      if (ep.direction === 'in') {
        ui.start.disabled = !link.claimed || link.reads.has(endpointKey(ep));
        ui.start.textContent = link.reads.has(endpointKey(ep)) ? '监听中' : '开始监听';
        ui.state.textContent = link.reads.has(endpointKey(ep)) ? '监听中' : '未监听';
      } else if (ui.send) {
        ui.send.disabled = !link.claimed || isFirmwareActive();
        ui.input.disabled = isFirmwareActive();
      }
    }
  }
  refreshFirmwareControls();
  refreshDebugControls();
}

function refreshFirmwareControls() {
  const active = isFirmwareActive();
  $firmwareFile.disabled = active;
  $chkAll.disabled = active;
  $btnFirmwareStart.disabled =
    active || !device || !device.opened || !$firmwareFile.files[0];
  $btnFirmwareCancel.disabled = !firmwareSession;
}

function refreshDebugControls() {
  const busy = isFirmwareActive() || kcBusy || ccQueryPromise !== null;
  const ready = Boolean(device?.opened) && links.length > 0;
  $btnCcQuery.disabled = busy || !ready;
  $btnKcReadLayer.disabled = busy || !ready;
  $kcLayer.disabled = busy;
  if (!ready) {
    $kcState.textContent = '未连接';
  }
}

function destroyLinks() {
  session++;
  for (const link of links) {
    for (const state of link.reads.values()) state.active = false;
  }
  links = [];
  renderInterfaces();
  updateCcPacketInfo();
}

async function connect() {
  if (!navigator.usb) {
    appendLine('[错误] 当前浏览器不支持 WebUSB，请使用 localhost 或 HTTPS 下的 Chrome/Edge。', 'err');
    return;
  }

  try {
    if (device) await disconnect();
    device = await navigator.usb.requestDevice({
      filters: [{ vendorId: VID, productId: PID }]
    });
    await device.open();
    if (device.configuration === null) await device.selectConfiguration(1);

    const token = ++session;
    links = device.configuration.interfaces.map(interfaceObject => {
      const alt = interfaceObject.alternate;
      return {
        number: interfaceObject.interfaceNumber,
        interfaceClass: alt.interfaceClass,
        interfaceObject,
        alt,
        claimed: false,
        reads: new Map(),
        rxHandlers: new Map(),
        ui: new Map(),
        token
      };
    });
    updateCcPacketInfo();
    renderInterfaces();

    $status.innerHTML = `已连接：<b>${device.productName}</b> · ` +
      `configuration ${device.configuration.configurationValue} · ` +
      `${links.length} interfaces`;
    btnConnect.disabled = true;
    btnDisconnect.disabled = false;

    appendLine(`设备已打开：${device.manufacturer || ''} ${device.productName || ''}`);
    for (const link of links) {
      const endpoints = link.alt.endpoints
        .map(ep => `${endpoinTag(ep)} ${ep.packetSize}B`)
        .join(', ') || '无端点';
      appendLine(`Interface ${link.number}: class=0x${link.interfaceClass.toString(16).padStart(2, '0')}, ${endpoints}`);
    }

    for (const link of links) {
      const auto = Boolean(INTERFACE_HINTS[link.number]?.auto);
      if (auto || $chkAll.checked) await claimLink(link);
    }
    /* 连接后先查设备信息，再自动读取当前层的全部键码 */
    queryCcDeviceInfo({ silent: true })
      .catch(() => {})
      .finally(() => { autoReadKeymap(); });
    refreshControls();
  } catch (error) {
    appendLine(`[连接失败] ${error.message || error}`, 'err');
    if (device && device.opened) await device.close().catch(() => {});
    device = null;
    destroyLinks();
    $status.textContent = '连接失败。';
    btnConnect.disabled = false;
    btnDisconnect.disabled = true;
    refreshControls();
  }
}

async function claimLink(link) {
  if (!device || !device.opened || link.claimed) return true;
  try {
    await device.claimInterface(link.number);
    link.claimed = true;
    appendLine(`Interface ${link.number} claim 成功`, '');
    for (const ep of link.alt.endpoints) {
      if (ep.direction === 'in') startRead(link, ep);
    }
    renderInterfaces();
    refreshControls();
    return true;
  } catch (error) {
    appendLine(`Interface ${link.number} claim 失败：${error.message || error}`, 'err');
    return false;
  }
}

async function releaseLink(link) {
  if (!link.claimed) return;
  for (const state of link.reads.values()) state.active = false;
  link.reads.clear();
  try {
    await device.releaseInterface(link.number);
    appendLine(`Interface ${link.number} 已释放`);
  } catch (error) {
    appendLine(`Interface ${link.number} 释放失败：${error.message || error}`, 'err');
  }
  link.claimed = false;
  renderInterfaces();
  refreshControls();
}

async function startRead(link, ep) {
  const key = endpointKey(ep);
  if (!link.claimed || link.reads.has(key)) return;
  const state = { active: true, count: 0, bytes: 0 };
  link.reads.set(key, state);
  refreshControls();

  while (state.active && device && device.opened && link.claimed) {
    try {
      const result = await device.transferIn(ep.endpointNumber, ep.packetSize);
      if (!state.active) break;
      if (result.status !== 'ok' || !result.data || result.data.byteLength === 0) continue;
      state.count++;
      state.bytes += result.data.byteLength;
      rxBytes += result.data.byteLength;
      $traffic.textContent = `RX ${rxBytes} B · TX ${txBytes} B`;
      const ui = link.ui.get(key);
      if (ui) ui.state.textContent = `监听中 · ${state.count} 包 / ${state.bytes} B`;
      const rxHandler = link.rxHandlers.get(key);
      if (rxHandler) {
        try {
          await rxHandler(result.data);
        } catch (handlerError) {
          appendLine(`[CC RX 处理失败] ${handlerError.message || handlerError}`,
                     'err');
        }
      } else {
        appendLine(`[RX IF${link.number} ${endpoinTag(ep)} ` +
                   `${result.data.byteLength}B] ${formatData(result.data)}`);
      }
    } catch (error) {
      if (state.active) {
        appendLine(`[RX 错误 IF${link.number} ${endpoinTag(ep)}] ` +
                   `${error.message || error}`, 'err');
      }
      break;
    }
  }

  link.reads.delete(key);
  refreshControls();
}

async function sendPacket(link, ep, input) {
  if (!device || !device.opened) return;
  if (isFirmwareActive()) {
    appendLine('[发送失败] 固件升级期间不能发送手动数据', 'warn');
    return;
  }
  if (!link.claimed) {
    appendLine(`[发送失败] Interface ${link.number} 未占用`, 'err');
    return;
  }

  try {
    const data = encodeInput(input.value);
    if (data.length > ep.packetSize) {
      throw new Error(`单包最多 ${ep.packetSize} 字节，当前 ${data.length} 字节`);
    }
    const result = await device.transferOut(ep.endpointNumber, data);
    if (result.status !== 'ok') {
      throw new Error(`transferOut status=${result.status}`);
    }
    if (result.bytesWritten !== data.length) {
      throw new Error(
        `transferOut 只提交了 ${result.bytesWritten}/${data.length} 字节`
      );
    }
    txBytes += data.length;
    $traffic.textContent = `RX ${rxBytes} B · TX ${txBytes} B`;
    appendLine(`[TX IF${link.number} ${endpoinTag(ep)} ${data.length}B] ` +
               formatData(data));
    input.value = '';
  } catch (error) {
    appendLine(`[发送失败 IF${link.number} ${endpoinTag(ep)}] ` +
               `${error.message || error}`, 'err');
  }
}

async function disconnect() {
  btnConnect.disabled = true;
  btnDisconnect.disabled = true;
  if (firmwareSession) firmwareSession.cancel();
  for (const link of links) {
    for (const state of link.reads.values()) state.active = false;
  }
  if (device && device.opened) {
    for (const link of links) {
      if (link.claimed) {
        await device.releaseInterface(link.number).catch(() => {});
      }
    }
    await device.close().catch(() => {});
  }
  device = null;
  destroyLinks();
  $status.textContent = '已断开。';
  btnConnect.disabled = false;
  btnDisconnect.disabled = true;
  refreshControls();
}

for (let layer = 0; layer < 4; layer++) {
  const option = document.createElement('option');
  option.value = String(layer);
  option.textContent = `L${layer}`;
  $kcLayer.appendChild(option);
}
renderKeyboard();
renderPicker();
if (globalThis.ResizeObserver) {
  new ResizeObserver(syncKeycapSize).observe($keyboard.closest('.keyboard-card'));
  new ResizeObserver(syncBoardSize).observe($pickerGroups);
}
$kcLayer.addEventListener('change', () => {
  kcSelected = null;
  $kcState.textContent = `L${$kcLayer.value}`;
  syncKeycaps();
  refreshControls();
  autoReadKeymap();
});

const navButtons = [...document.querySelectorAll('.nav-btn')];
function selectView(name) {
  for (const btn of navButtons) {
    btn.classList.toggle('active', btn.dataset.view === name);
  }
  for (const view of ['remap', 'upgrade', 'debug']) {
    document.getElementById(`view-${view}`)
      .classList.toggle('active', view === name);
  }
}
for (const btn of navButtons) {
  btn.addEventListener('click', () => selectView(btn.dataset.view));
}

$firmwareFile.addEventListener('change', () => {
  resetFirmwareDuration();
  const file = $firmwareFile.files[0];
  if (!file) {
    setFirmwareState('请选择升级文件。');
    updateFirmwareProgress(0, 0);
    refreshFirmwareControls();
    return;
  }
  updateFirmwareProgress(0, file.size);
  setFirmwareState(`已选择 ${file.name}，等待开始升级。`);
  refreshFirmwareControls();
});
$btnFirmwareStart.addEventListener('click', startFirmwareUpgrade);
$btnFirmwareCancel.addEventListener('click', cancelFirmwareUpgrade);
$btnCcQuery.addEventListener('click', () => {
  queryCcDeviceInfo().catch(() => {});
});
$btnKcReadLayer.addEventListener('click', readKeycodeLayer);
btnConnect.addEventListener('click', connect);
btnDisconnect.addEventListener('click', disconnect);
document.getElementById('btnClear').addEventListener('click', () => {
  $log.textContent = '';
  rxBytes = 0;
  txBytes = 0;
  $traffic.textContent = 'RX 0 B · TX 0 B';
});
$chkLf.addEventListener('change', () => {
  for (const link of links) {
    for (const ep of link.alt.endpoints) {
      if (ep.direction !== 'out') continue;
      const input = link.ui.get(endpointKey(ep))?.input;
      if (input) input.placeholder = $inputMode.value === 'hex'
        ? '例如：01 02 0a ff'
        : '输入文本，按回车或点击发送';
    }
  }
});
$inputMode.addEventListener('change', () => {
  for (const link of links) {
    for (const ep of link.alt.endpoints) {
      if (ep.direction !== 'out') continue;
      const input = link.ui.get(endpointKey(ep))?.input;
      if (input) input.placeholder = $inputMode.value === 'hex'
        ? '例如：01 02 0a ff'
        : '输入文本，按回车或点击发送';
    }
  }
});
$chkAll.addEventListener('change', async () => {
  if (!$chkAll.checked || !device || !device.opened) return;
  for (const link of links) {
    if (!link.claimed) await claimLink(link);
  }
  refreshControls();
});

navigator.usb?.addEventListener('disconnect', event => {
  if (device && event.device === device) {
    appendLine('[设备已拔出]', 'err');
    disconnect();
  }
});
</script>
</body>
</html>
